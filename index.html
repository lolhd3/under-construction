<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #5e5e5e;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .card {
      background: var(--card);
      padding: 48px 64px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px var(--shadow);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.6rem;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Under Construction</h1>
    <p>We are working on something amazing. Please check back soon.</p>
  </div>
</body>
</html>
